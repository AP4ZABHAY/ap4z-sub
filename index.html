<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>AP4Z Subscription</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#ef0909;font-family:Arial,Helvetica,sans-serif;color:#000}
.page{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{height:74px;flex:0 0 74px;display:flex;align-items:center;justify-content:center;gap:12px;padding:5px 14px}
.logo{width:60px;height:60px;border-radius:50%;object-fit:cover;display:block}
.brand{font-size:clamp(18px,3vw,30px);font-weight:800;white-space:nowrap}
.desktop-poster{display:block;width:min(1100px,96vw);height:auto;max-height:calc(100dvh - 74px);object-fit:contain;margin:0 auto}
.mobile-plans{display:none}
@media(max-width:700px){
 .header{height:64px;flex-basis:64px;gap:9px}
 .logo{width:54px;height:54px}
 .brand{font-size:17px}
 .desktop-poster{display:none}
 .mobile-plans{display:flex;flex:1;min-height:0;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;padding:2px 10px 8px;gap:2px}
 .mobile-title{font-weight:900;font-size:clamp(18px,5vw,25px);margin:0 0 3px;text-align:center;line-height:1}
 .plans{width:100%;display:flex;flex-direction:column;gap:6px;min-height:0}
 .plan{width:100%;height:auto;display:block}
 .buy{position:absolute;display:block;z-index:3}
 .card{position:relative;width:min(96vw,520px);margin:0 auto}
 .card img{width:100%;display:block}
 .buy{left:13%;bottom:8%;width:74%;height:15%}
}
@media(min-width:701px){
 .desktop-wrap{position:relative;display:flex;justify-content:center;overflow:hidden;flex:1}
 .desktop-buy{position:absolute;z-index:4;top:79%;height:9%;width:28%}
 .db1{left:13%}.db2{right:13%}
}
</style>
</head>
<body>
<div class="page">
<header class="header">
<img class="logo" src="ap4z_logo_circle.jpg" alt="AP4Z logo">
<div class="brand">MADE BY AP4Z ABHAY</div>
</header>

<div class="desktop-wrap">
<img class="desktop-poster" src="subscription.png" alt="AP4Z subscription plans">
<a class="desktop-buy db1" href="https://t.me/AP4ZxABHAY" aria-label="Start 1 month plan"></a>
<a class="desktop-buy db2" href="https://t.me/AP4ZxABHAY" aria-label="Start 2 month plan"></a>
</div>

<section class="mobile-plans">
<h1 class="mobile-title">UNLOCK THE FULL AP4Z EXPERIENCE</h1>
<div class="plans">
<div class="card"><img src="plan1.png" alt="1 month plan"><a class="buy" href="https://t.me/AP4ZxABHAY" aria-label="Start 1 month plan"></a></div>
<div class="card"><img src="plan2.png" alt="2 month plan"><a class="buy" href="https://t.me/AP4ZxABHAY" aria-label="Start 2 month plan"></a></div>
</div>
</section>
</div>
</body>
</html>
